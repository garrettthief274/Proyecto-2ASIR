---
# tasks file for roles/ingress
- name: Verificar Traefik
  shell: kubectl get pods -n kube-system | grep traefik
  register: traefik_check
  ignore_errors: yes

- name: Mostrar estado Traefik
  debug:
    var: traefik_check.stdout

- name: Crear ingress Grafana
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: grafana-ingress
      namespace: monitoring
    spec:
      ingressClassName: traefik
      rules:
      - host: grafana.local
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
    EOF

- name: Crear ingress Prometheus
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: prometheus-ingress
      namespace: monitoring
    spec:
      ingressClassName: traefik
      rules:
      - host: prometheus.local
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
    EOF

- name: Verificar ingress
  shell: kubectl get ingress -A
  register: ingress_status

- name: Mostrar ingress
  debug:
    var: ingress_status.stdout
