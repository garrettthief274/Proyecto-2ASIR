tty: true

driver:
  kind: modern_ebpf

collectors:
  containerd:
    enabled: true

falco:
  jsonOutput: true
  jsonIncludeOutputProperty: true
  log_level: info

  grpc:
    enabled: true
  grpc_output:
    enabled: true

falcosidekick:
  enabled: true

  config:
    debug: true
    customfields: "cluster:k3d-soc,environment:lab"
    minimumpriority: "Notice"

    loki:
      hostport: "http://loki.logging.svc.cluster.local:3100"

    smtp:
      hostport: "URL_SERVIDOR_SMTP:587"
      user: "CORREO@DOMINIO.ES"
      password: "CONTRASEÑA_DE_CORREO"

      from: "CORREO@DOMINIO.ES"
      to: "CORREO@DOMINIO.ES"

      insecure: true
      tls: true

      authmechanism: "plain"

      outputformat: "html"

    webhook:
      address: "http://host.k3d.internal:5000/"

